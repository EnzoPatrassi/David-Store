<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enzo House - Tu Tecnología</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Carga de Tailwind CSS v4 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-crema: #F5F1E8;
            --color-azul: #202B65;
            --color-turquesa: #20BFC0;
            --color-rosa: #E8A0B0;
            --color-coral: #C92F4B;
            --color-verde: #3F9B55;
            --color-lavanda: #A9A2D0;
        }
        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--color-crema);
            color: var(--color-azul);
            /* Trama de puntos (Halftone) estilo cómic retro */
            background-image: radial-gradient(circle, rgba(32, 43, 101, 0.1) 2px, transparent 2.5px);
            background-size: 20px 20px;
            overflow-x: hidden;
        }
        
        /* Utilidades Cómic */
        .comic-font { font-family: 'Bangers', cursive; letter-spacing: 1px; }
        
        .comic-panel {
            background-color: #ffffff;
            border: 4px solid var(--color-azul);
            box-shadow: 6px 6px 0px 0px var(--color-azul);
            transition: all 0.2s ease;
        }
        .comic-panel:hover {
            transform: translate(-2px, -2px);
            box-shadow: 10px 10px 0px 0px var(--color-azul);
        }
        
        .comic-btn {
            border: 3px solid var(--color-azul);
            box-shadow: 4px 4px 0px 0px var(--color-azul);
            font-family: 'Bangers', cursive;
            letter-spacing: 2px;
            transition: all 0.1s ease;
            text-transform: uppercase;
        }
        .comic-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px 0px var(--color-azul);
        }
        
        /* Inputs y Selects */
        input, select {
            border: 3px solid var(--color-azul);
            background-color: #ffffff;
            color: var(--color-azul);
            font-weight: 800;
        }
        input:focus, select:focus {
            outline: none;
            background-color: var(--color-crema);
        }
        /* Arreglo para la lista desplegable del selector */
        option {
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: normal;
            text-transform: none;
            background-color: var(--color-crema);
            color: var(--color-azul);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <!-- NAVEGACIÓN -->
    <nav class="bg-white text-azul p-4 sticky top-0 z-50 flex justify-between items-center border-b-4 border-azul shadow-[0_4px_0_0_#202B65]">
        <div class="flex items-center gap-6">
            <a href="index.html" class="flex items-center gap-2">
                <i class="fa-solid fa-house text-rosa text-3xl" style="-webkit-text-stroke: 2px #202B65;"></i>
                <h1 class="comic-font text-3xl tracking-wider mt-1 hidden sm:block">Enzo House</h1>
            </a>
            <div class="flex gap-4">
                <a href="index.html" class="font-bold hover:text-turquesa transition">Inicio</a>
                <a href="productos.html" class="font-bold text-turquesa underline decoration-4">Catálogo</a>
            </div>
        </div>
        
        <a href="carrito.html" class="relative bg-white text-azul p-3 rounded-full comic-btn hover:bg-turquesa hover:text-white flex items-center justify-center">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="carrito-contador absolute -top-3 -right-3 bg-coral text-white comic-font text-lg w-7 h-7 flex items-center justify-center rounded-full border-2 border-azul hidden">0</span>
        </a>
    </nav>

    <!-- CONTROLES -->
    <section class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Botón de filtros (solo visible en celular) -->
        <div class="flex justify-center w-full mb-6 md:hidden">
            <button id="btn-menu-mobile" class="bg-white text-azul comic-btn px-4 py-2 hover:bg-turquesa hover:text-white w-full">
                <i class="fa-solid fa-bars mr-2"></i> Categorías
            </button>
        </div>

        <!-- Diseño Panal para las Categorías (Centrado y apilado) -->
        <nav id="menu-categorias-nav" class="menu-categorias hidden md:flex flex-row flex-wrap justify-center items-center gap-x-3 gap-y-4 w-full max-w-2xl mx-auto transition-all">
            <button class="btn-categoria bg-turquesa text-white comic-btn px-6 py-2 activo" data-filtro="todos">Todos</button>
            <button class="btn-categoria bg-white text-azul comic-btn px-6 py-2 hover:bg-turquesa hover:text-white" data-filtro="auriculares">Auriculares</button>
            <button class="btn-categoria bg-white text-azul comic-btn px-6 py-2 hover:bg-turquesa hover:text-white" data-filtro="smartwatchs">Smart Watchs</button>
            <button class="btn-categoria bg-white text-azul comic-btn px-6 py-2 hover:bg-turquesa hover:text-white" data-filtro="manoslibres">Manos Libres</button>
            <button class="btn-categoria bg-white text-azul comic-btn px-6 py-2 hover:bg-turquesa hover:text-white" data-filtro="parlantes">Parlantes</button>
            <button class="btn-categoria bg-white text-azul comic-btn px-6 py-2 hover:bg-turquesa hover:text-white" data-filtro="relojes">Relojes</button>
            <button class="btn-categoria bg-white text-azul comic-btn px-6 py-2 hover:bg-turquesa hover:text-white" data-filtro="adaptadores">Adaptadores</button>
            <button class="btn-categoria bg-white text-azul comic-btn px-6 py-2 hover:bg-turquesa hover:text-white" data-filtro="informatica">Informática</button>
        </nav>
        
    </section>

    <!-- PRODUCTOS -->
    <main class="max-w-7xl mx-auto px-4 pb-20 flex-grow">
        
        <!-- SELECTOR DE ORDEN (Alineado a la derecha) -->
        <div class="flex justify-end mb-6">
            <select id="select-orden" class="bg-white text-azul font-black text-sm md:text-base border-4 border-azul uppercase px-4 py-2 rounded-none shadow-[4px_4px_0px_0px_#202B65] cursor-pointer hover:bg-crema transition w-full md:w-auto outline-none">
                <option value="defecto">Ordenar por...</option>
                <option value="precio-menor">Menor Precio</option>
                <option value="precio-mayor">Mayor Precio</option>
                <option value="az">Nombre (A - Z)</option>
                <option value="za">Nombre (Z - A)</option>
            </select>
        </div>

        <div id="contenedor-productos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
            <!-- Inyectado por JS -->
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-azul text-white py-12 border-t-8 border-azul mt-auto shadow-[0_-4px_0_0_#20BFC0]">
        <div class="max-w-7xl mx-auto px-4 text-center flex flex-col items-center">
            <h3 class="comic-font text-4xl mb-2 text-crema">Enzo House</h3>
            <p class="text-crema/80 font-bold mb-6">Tu tienda de tecnología.</p>
            
            <!-- Botón Instagram -->
            <a href="https://instagram.com/tienda.enzohouse" target="_blank" class="inline-flex items-center gap-2 bg-rosa text-azul comic-btn px-6 py-2 mb-8 hover:bg-turquesa hover:text-white transition">
                <i class="fa-brands fa-instagram text-2xl"></i>
                <span class="font-black tracking-wider">tienda.enzohouse</span>
            </a>
            
            <!-- Derechos de autor -->
            <p class="text-crema/60 text-sm font-bold">&copy; 2026 Enzo House. Todos los derechos reservados.</p>
        </div>
    </footer>
    <script src="js/productos.js"></script>
</body>
</html>
